spring:
  application:
    name: srm-fleet-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS}
  storage:
    # Répertoire racine des pièces jointes de sinistres (monté sur un volume Docker en conteneur).
    documents: ${APP_STORAGE_DOCUMENTS:./data/documents}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
