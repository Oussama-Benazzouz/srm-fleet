<main class="login">
  <div class="login__panel">
    <header class="login__head">
      <div class="login__logo" aria-hidden="true">SRM</div>
      <h1 class="login__title">Gestion de flotte</h1>
      <p class="login__subtitle">Connectez-vous pour accéder à votre espace.</p>
    </header>

    <form class="login__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <!-- Les erreurs serveur sont annoncées dès leur apparition. -->
      <div role="alert" aria-live="polite">
        @if (error(); as message) {
          <div class="alert alert--danger">
            <svg class="alert__icon" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M8 1.5 15 14H1L8 1.5Z M8 6.2v3.4 M8 11.4v.9"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linejoin="round"
                stroke-linecap="round"
              />
            </svg>
            <span>{{ message }}</span>
          </div>
        }
      </div>

      <div class="field">
        <label class="field__label" for="login">Identifiant</label>
        <input
          id="login"
          class="input"
          type="text"
          formControlName="login"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          [attr.aria-invalid]="isInvalid('login')"
          [attr.aria-describedby]="isInvalid('login') ? 'login-error' : null"
        />
        @if (isInvalid('login')) {
          <p class="field__error" id="login-error">L'identifiant est requis.</p>
        }
      </div>

      <div class="field">
        <label class="field__label" for="password">Mot de passe</label>
        <div class="login__password">
          <input
            id="password"
            class="input"
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="motDePasse"
            autocomplete="current-password"
            [attr.aria-invalid]="isInvalid('motDePasse')"
            [attr.aria-describedby]="isInvalid('motDePasse') ? 'password-error' : null"
          />
          <button
            type="button"
            class="login__reveal"
            (click)="togglePassword()"
            [attr.aria-pressed]="passwordVisible()"
            [attr.aria-label]="
              passwordVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
            "
          >
            @if (passwordVisible()) {
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path
                  d="M2.5 10S5.5 4.8 10 4.8 17.5 10 17.5 10 14.5 15.2 10 15.2 2.5 10 2.5 10Z M3 3l14 14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
            } @else {
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path
                  d="M2.5 10S5.5 4.8 10 4.8 17.5 10 17.5 10 14.5 15.2 10 15.2 2.5 10 2.5 10Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
                <circle cx="10" cy="10" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4" />
              </svg>
            }
          </button>
        </div>
        @if (isInvalid('motDePasse')) {
          <p class="field__error" id="password-error">Le mot de passe est requis.</p>
        }
      </div>

      <button type="submit" class="btn btn--primary btn--block" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
          <span>Connexion…</span>
        } @else {
          <span>Se connecter</span>
        }
      </button>
    </form>
  </div>

  <p class="login__footer">Accès réservé aux collaborateurs autorisés.</p>
</main>
