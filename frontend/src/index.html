<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>SRM — Gestion de flotte</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/jpeg" href="logo-srm.jpg" />

    <!-- Roboto : typographie officielle de la charte SRM Souss-Massa. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Applique le thème mémorisé avant le rendu pour éviter tout flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('srm-theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
